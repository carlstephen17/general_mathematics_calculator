<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pythagorean Theorem</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='pythagorean.css') }}">
</head>
<body>
  <nav class="navbar">
    <a href="{{ url_for('index') }}" class="nav-link">Home</a>
    <a href="{{ url_for('pure_mathematics') }}" class="nav-link">Pure Mathematics</a>
    <a href="{{ url_for('about') }}" class="nav-link">About</a>
    <div class="nav-btn">
      <a href="/premium" id="premium" class="btn-log">💎 Get Premium</a>
      <a href="/logout" id="logoutLink" class="btn-log">Logout</a>
    </div>
  </nav>

  <h1>Pythagorean Theorem</h1>

  <div class="content-wrapper">
    <div class="container">
      <h2>Calculator</h2>

      <!-- Display Result -->
      <input type="text" id="display" readonly placeholder="Result will appear here">

      <select id="selected"  onchange='selection()'>
        <option value="noMissing">Select a Missing Value</option>
        <option value="missingA">Missing A</option>
        <option value="missingB">Missing B</option>
        <option value="missingC">Missing C</option>
      </select>

      <!-- Input Numbers -->
      <label for="a" id="labelA">Value A</label>
      <input type="text" id="a" placeholder="Enter the value of A" required>

      <label for="b" id="labelB">Value B</label>
      <input type="text" id="b" placeholder="Enter the value of B" required>
       
      <label for="c" id="labelC">Value C</label>
      <input type="text" id="c" placeholder="Enter the value of C" required>

      <button onclick="pythagorean()" id="pythagoreanBtn">Calculate</button>
    </div>

    <!-- Scrollable Outcome Container -->
    <div class="outcomeContainer">
      <h1>Solution:</h1>
      <p id="outcome">Enter values and click Calculate to see the solution.</p>

      <h1>Explanation:</h1>
      <p id="explanation">Explanation will appear here.</p>
    </div>
  </div>

  <!-- JS -->
  <script src="{{ url_for('static', filename='pythagorean.js') }}"></script>
</body>
</html>
