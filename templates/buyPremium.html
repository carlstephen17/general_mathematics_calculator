<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Purchase</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='buyPremium.css') }}">

</head>

<body>
    <nav class="navbar">
        <a href="{{ url_for('index') }}" class="nav-link">Home</a>
        <a href="{{ url_for('about') }}" class="nav-link">About</a>
        <div class="nav-btn">
            <a href="/premium" id="premium" class="btn-log">💎 Get Premium</a>
            <a href="/logout" id="logoutLink" class="btn-log">Logout</a>
        </div>
    </nav>

    <div class="container">
        <h2 id="unlock">Unlock Premium Features</h2>
        <label for="username">Username</label>
        <input type="text" class="input" id="username" placeholder="Enter your username">

        <label for="email">Email</label>
        <input type="text" class="input" id="email" placeholder="Enter your email">

        <label for="phoneNumber">Phone Number</label>
        <input type="tel" class="input" id="phoneNumber" placeholder="Enter your phone number">

        <label for="dateOfBirth">Date Of Birth</label>
        <input type="date" class="input" id="dateOfBirth" placeholder="Enter your date of birth">
        
        <label for="cardNumber">Card Number</label>
        <input type="tel" class="input" id="cardNumber" placeholder="XXX-XXX-XXX">

        <label for="password">Password</label>
        <input type="password" class="input" id="password" placeholder="Enter your password">

        <label for="confirmPassword">Confirm Password</label>
        <input type="password" class="input" id="confirmPassword" placeholder="Confirm your password">

        <button type="button" class="input" id="paymentBtn">Proceed to Payment</button>
    </div>

</body>

</html>
